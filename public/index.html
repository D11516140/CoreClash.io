<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoreClash.io - Cyber RTS</title>
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

<div id="game-wrapper">
  <canvas id="gameCanvas" width="1200" height="800"></canvas>

  <!-- 🚪 大廳選擇 Modal -->
  <div id="lobby-modal">
    <h1>CoreClash.io</h1>
    <p class="lobby-subtitle">即時賽博戰術競技場</p>
    
    <div class="lobby-box">
      <div class="input-group">
        <label for="nickname-input">指揮官代號 (NICKNAME)</label>
        <input type="text" id="nickname-input" class="name-input" placeholder="輸入你的指揮官名稱..." maxlength="12">
      </div>

      <div class="controls-guide">
        <div class="guide-row"><span>WASD</span><span class="guide-key">指揮官移動</span></div>
        <div class="guide-row"><span>E 鍵</span><span class="guide-key">建基地 / 傳送回基地</span></div>
        <div class="guide-row"><span>1 / 2 鍵</span><span class="guide-key">防禦塔 / 軍隊選單</span></div>
        <div class="guide-row"><span>F 鍵</span><span class="guide-key">切換部隊戰術 (護衛/駐守/自由)</span></div>
        <div class="guide-row"><span>Tab 鍵</span><span class="guide-key">切換詳細面板說明</span></div>
      </div>

      <button id="start-game-btn" class="play-btn" onclick="joinBattleFromLobby()">⚔️ 加入戰局 (ENTER BATTLE)</button>
    </div>
  </div>

  <!-- 左側 HUD 狀態面板 -->
  <div class="hud-card">
    <div class="hud-stat">
      <span>💰 金幣</span>
      <span id="ui-gold" class="stat-val" style="color: var(--warning);">250</span>
    </div>
    <div class="hud-stat">
      <span>🏰 核心血量</span>
      <span id="ui-core-hp-text" class="stat-val" style="color: var(--danger);">未放置 (按E)</span>
    </div>
    <div class="hp-bar-bg"><div id="ui-core-hp-bar" class="hp-bar-fill" style="width: 0%;"></div></div>
    <div class="hud-stat" style="margin-top: 6px;">
      <span>⚔️ 軍隊數量</span>
      <span id="ui-army-count" class="stat-val" style="color: var(--primary);">0</span>
    </div>
    <div class="hud-stat" style="margin-top: 2px;">
      <span>⚡ 移動速度</span>
      <span id="ui-move-speed" class="stat-val" style="color: var(--success);">100%</span>
    </div>
    <div class="hud-stat">
      <span>🚩 軍隊模式</span>
      <span id="ui-army-mode" class="stat-val" style="color: var(--success);">跟隨</span>
    </div>
  </div>

  <!-- 🏆 右側 HUD 容器 (頁籤式排行榜) -->
  <div class="right-hud-panel">
    <div class="leaderboard-card">
      <div class="lb-header">
        <div class="lb-tabs">
          <button id="lb-tab-player" class="lb-tab-btn active" onclick="switchLbTab('PLAYER')">👤 個人</button>
          <button id="lb-tab-alliance" class="lb-tab-btn" onclick="switchLbTab('ALLIANCE')">🛡️ 聯盟</button>
        </div>
        <span id="ui-player-count" style="color: var(--primary);">1 在線</span>
      </div>
      <div id="leaderboard-list"></div>
    </div>

    <!-- 🛡️ 聯盟 UI 面板 -->
    <div class="alliance-card">
      <div id="alliance-create-box">
        <div style="font-size: 12px; font-weight: bold; color: var(--primary); margin-bottom: 6px;">🛡️ 聯盟 / 部落組隊</div>
        <div class="alliance-input-row">
          <input type="text" id="alliance-name-input" class="name-input" style="padding: 4px 8px; font-size: 12px; width: 100%;" placeholder="聯盟名稱..." maxlength="10">
          <button class="alliance-btn" onclick="createAllianceFromUI()">創立</button>
        </div>
      </div>

      <div id="alliance-invite-box" class="notice-box" style="display: none;">
        <div class="notice-row">
          <span id="invite-notice-text" style="color: var(--warning); font-weight: bold;">收到邀請</span>
          <div style="display: flex; gap: 4px;">
            <button class="icon-btn btn-approve" title="同意加入" onclick="respondInviteFromUI(true)">✔</button>
            <button class="icon-btn btn-reject" title="拒絕邀請" onclick="respondInviteFromUI(false)">✖</button>
          </div>
        </div>
      </div>

      <div id="alliance-info-box" style="display: none; flex-direction: column; gap: 6px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span id="alliance-display-name" style="font-size: 13px; font-weight: bold; color: var(--primary);">🛡️ 聯盟：無</span>
          <div style="display: flex; gap: 4px;">
            <button id="alliance-setting-btn" class="alliance-btn setting-btn" title="聯盟設定" onclick="openSettingsModal()" style="display: none; padding: 4px 8px;">⚙️</button>
            <button id="alliance-leave-btn" class="alliance-btn leave-btn" onclick="leaveAllianceFromUI()">退出</button>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px; background: rgba(0,0,0,0.25); padding: 6px; border-radius: 6px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span id="alliance-member-count" style="font-size: 11px; color: #9ca3af;">成員 (0人)</span>
            <button class="alliance-btn" style="padding: 2px 6px; font-size: 10px;" onclick="openMembersModal()">👥 查看全體成員</button>
          </div>
          <div id="alliance-top-members" style="font-size: 11px; color: var(--text);"></div>
        </div>

        <div id="alliance-requests-container" class="notice-box" style="display: none; border-color: var(--warning);">
          <div class="notice-row">
            <span id="req-count-title" style="color: var(--warning); font-weight: bold;">📥 申請清單 (0)</span>
          </div>
          <div class="req-item">
            <span id="req-oldest-name" style="color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px;">-</span>
            <div style="display: flex; gap: 4px;">
              <button class="icon-btn btn-approve" title="同意加入" onclick="respondAllianceApp(true)">✔</button>
              <button class="icon-btn btn-reject" title="拒絕申請" onclick="respondAllianceApp(false)">✖</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ⚙️ 聯盟設定 Modal -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">⚙️ 聯盟招募設定</span>
        <button class="icon-btn btn-reject" style="font-size: 18px;" onclick="closeSettingsModal()">✕</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button id="opt-free" class="mode-opt-btn" onclick="setRecruitmentModeUI('FREE')">
          <span>🟢 自由加入 (無需審核)</span>
        </button>
        <button id="opt-review" class="mode-opt-btn" onclick="setRecruitmentModeUI('REVIEW')">
          <span>🟡 審核加入 (需要盟主按 ✔)</span>
        </button>
        <button id="opt-closed" class="mode-opt-btn" onclick="setRecruitmentModeUI('CLOSED')">
          <span>🔴 封閉聯盟 (拒絕主動申請)</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 📜 全體成員滾動 Modal -->
  <div id="members-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <span id="modal-alliance-title" class="modal-title">🛡️ 聯盟成員列表</span>
        <button class="icon-btn btn-reject" style="font-size: 18px;" onclick="closeMembersModal()">✕</button>
      </div>
      <div id="modal-members-list" class="scroll-list"></div>
    </div>
  </div>

  <!-- 💬 遊戲內自訂確認 Modal -->
  <div id="custom-confirm-modal" class="modal-overlay">
    <div class="modal-box" style="width: 380px; text-align: center; gap: 16px;">
      <div id="confirm-title" style="font-size: 17px; font-weight: bold; color: var(--primary);">提示</div>
      <div id="confirm-msg" style="font-size: 14px; color: var(--text); line-height: 1.6; word-break: break-all;">確定要執行此操作嗎？</div>
      <div id="confirm-btn-group" style="display: flex; justify-content: center; gap: 12px; margin-top: 8px;">
        <button id="confirm-btn-yes" class="alliance-btn leave-btn" style="padding: 8px 22px; font-size: 13px;">確定</button>
        <button id="confirm-btn-no" class="alliance-btn" style="padding: 8px 22px; font-size: 13px; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3);" onclick="closeCustomConfirm()">取消</button>
      </div>
    </div>
  </div>

  <!-- 底部控制列 -->
  <div id="controls-bar">
    <button id="btn-back" class="key-btn back-btn" onclick="exitSubMenu()" style="display: none;">
      <span class="key-badge">~</span> <span>返回 / 退出</span>
    </button>
    <button id="btn-core" class="key-btn" onclick="triggerMenuKey('E')">
      <span class="key-badge">E</span> <span id="label-e">建基地</span>
    </button>
    <button id="btn-menu1" class="key-btn" onclick="triggerMenuKey('1')">
      <span class="key-badge">1</span> <span id="label-1">防禦塔選單</span>
    </button>
    <button id="btn-menu2" class="key-btn" onclick="triggerMenuKey('2')">
      <span class="key-badge">2</span> <span id="label-2">軍隊徵召選單</span>
    </button>
    <button id="btn-f" class="key-btn" onclick="triggerMenuKey('F')">
      <span class="key-badge">F</span> <span>切換軍隊模式</span>
    </button>
  </div>

  <!-- ☠️ 死亡 / 遊戲結束 Modal -->
  <div id="game-over-modal">
    <h1>CORE DESTROYED</h1>
    <p style="color: #9ca3af;">你的基地已被摧毀，試著重新佈局戰術吧！</p>
    <div style="display: flex; gap: 16px; margin-top: 8px;">
      <button class="restart-btn" onclick="restartGame()">⚔️ 重新開始</button>
      <button class="restart-btn secondary-btn" onclick="returnToLobby()">🏠 回到大廳</button>
    </div>
  </div>
</div>

<script>
  function autoScaleGame() {
    const wrapper = document.getElementById('game-wrapper');
    if (!wrapper) return;
    const scale = Math.min((window.innerWidth * 0.95) / 1200, (window.innerHeight * 0.95) / 800);
    wrapper.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', autoScaleGame);
  window.addEventListener('DOMContentLoaded', autoScaleGame);
  autoScaleGame();
</script>
<script src="/socket.io/socket.io.js"></script>
<script src="js/ui.js?v=5"></script>
<script src="js/render.js?v=5"></script>
<script src="game.js?v=5"></script>
</body>
</html>
