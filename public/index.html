<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoreClash.io - Cyber RTS</title>
  <link rel="stylesheet" href="css/style.css?v=22">
</head>
<body>

<div id="game-wrapper">
  <canvas id="gameCanvas" width="1200" height="800"></canvas>

  <!-- 💬 賽博風動態 Toast 提示彈窗 -->
  <div id="cyber-toast" class="cyber-toast"></div>

  <!-- 🚪 主畫面大廳 Modal -->
  <div id="lobby-modal">
    <div class="lobby-header-bar">
      <button class="top-bar-btn" onclick="showCyberToast('💬 感謝反饋！官方頻道建置中...')">💬 反饋</button>
      <span class="version-tag">v0.4.0 Alpha</span>
    </div>

    <div class="lobby-logo-box">
      <h1>🎮 CORECLASH.IO</h1>
      <p class="lobby-subtitle">即時賽博戰術競技場</p>
    </div>

    <div class="mode-cards-container">
      <div class="mode-card side-card" onclick="showCyberToast('📖 新手戰術引導模式開發中！')">
        <div class="card-icon">📖</div>
        <div class="card-title">新手教學</div>
        <div class="card-desc">基礎作戰與建構指南</div>
        <div class="card-action-btn secondary">📘 進入模擬</div>
      </div>

      <div class="mode-card primary-card" onclick="joinBattleFromLobby()">
        <div class="card-icon">⚔️</div>
        <div class="card-title">PVP 戰場</div>
        <div class="card-desc">多人即時連線對決</div>
        <div class="card-action-btn">🟢 進入戰局</div>
      </div>

      <div class="mode-card side-card" onclick="startSandboxMode()">
        <div class="card-icon">🧪</div>
        <div class="card-title">沙盒訓練場</div>
        <div class="card-desc">單人自由測試與實驗</div>
        <div class="card-action-btn secondary">⚡ 開啟訓練</div>
      </div>
    </div>

    <div class="lobby-footer-bar">
      <div class="player-identity-card">
        <div class="identity-title">👑 指揮官個人檔案</div>
        <div class="identity-rows">
          <div class="id-row">
            <span class="id-label">代表色：</span>
            <div class="color-picker-group">
              <div class="color-dot active" data-color="#ffb700" style="background: #ffb700;" onclick="selectPlayerColor('#ffb700', this)"></div>
              <div class="color-dot" data-color="#00f0ff" style="background: #00f0ff;" onclick="selectPlayerColor('#00f0ff', this)"></div>
              <div class="color-dot" data-color="#00ff66" style="background: #00ff66;" onclick="selectPlayerColor('#00ff66', this)"></div>
              <div class="color-dot" data-color="#ec4899" style="background: #ec4899;" onclick="selectPlayerColor('#ec4899', this)"></div>
              <div class="color-dot" data-color="#ff0055" style="background: #ff0055;" onclick="selectPlayerColor('#ff0055', this)"></div>
            </div>
          </div>
          <div class="id-row">
            <span class="id-label">暱稱：</span>
            <input type="text" id="nickname-input" class="name-input-styled" placeholder="輸入指揮官代號..." maxlength="12">
          </div>
        </div>
      </div>

      <div class="system-btn-group">
        <button class="sys-btn" onclick="showCyberToast('⚙️ 系統與控制設定選單開發中！')">⚙️ 設定</button>
        <button class="sys-btn leave" onclick="confirmLeaveGame()">🚪 離開</button>
      </div>
    </div>
  </div>

  <!-- 👈 左側 HUD 面板 -->
  <div class="hud-card">
    <div class="hud-stat">
      <span>💰 金幣</span>
      <span id="ui-gold" class="stat-val" style="color: var(--warning);">250</span>
    </div>
    <div class="hud-stat">
      <span>🏰 核心血量</span>
      <span id="ui-core-hp-text" class="stat-val" style="color: var(--danger);">未放置 (按E)</span>
    </div>
    <div class="hp-bar-bg"><div id="ui-core-hp-bar" class="hp-bar-fill" style="width: 0%;"></div></div>
    <div class="hud-stat" style="margin-top: 6px;">
      <span>⚔️ 軍隊數量</span>
      <span id="ui-army-count" class="stat-val" style="color: var(--primary);">0</span>
    </div>
    <div class="hud-stat" style="margin-top: 2px;">
      <span>⚡ 移動速度</span>
      <span id="ui-move-speed" class="stat-val" style="color: var(--success);">100%</span>
    </div>
    <div class="hud-stat">
      <span>🚩 軍隊模式</span>
      <span id="ui-army-mode" class="stat-val" style="color: var(--success);">跟隨</span>
    </div>
  </div>

  <!-- 🏆 右側 HUD 容器 -->
  <div class="right-hud-panel">
    <div class="leaderboard-card">
      <div class="lb-header">
        <div class="lb-tabs">
          <button id="lb-tab-player" class="lb-tab-btn active" onclick="switchLbTab('PLAYER')">👤 個人</button>
          <button id="lb-tab-alliance" class="lb-tab-btn" onclick="switchLbTab('ALLIANCE')">🛡️ 聯盟</button>
        </div>
        <span id="ui-player-count" style="color: var(--primary);">1 在線</span>
      </div>
      <div id="leaderboard-list"></div>
    </div>

    <!-- 🛡️ 聯盟 UI 面板 -->
    <div class="alliance-card">
      <div id="alliance-create-box">
        <div style="font-size: 12px; font-weight: bold; color: var(--primary); margin-bottom: 6px;">🛡️ 聯盟 / 部落組隊</div>
        <div class="alliance-input-row">
          <input type="text" id="alliance-name-input" class="name-input" style="padding: 4px 8px; font-size: 12px; width: 100%;" placeholder="聯盟名稱..." maxlength="10">
          <button class="alliance-btn" onclick="createAllianceFromUI()">創立</button>
        </div>
      </div>

      <div id="alliance-invite-box" class="notice-box" style="display: none;">
        <div class="notice-row">
          <span id="invite-notice-text" style="color: var(--warning); font-weight: bold;">收到邀請</span>
          <div style="display: flex; gap: 4px;">
            <button class="icon-btn btn-approve" title="同意邀請" onclick="respondInviteFromUI(true)">✔</button>
            <button class="icon-btn btn-reject" title="拒絕邀請" onclick="respondInviteFromUI(false)">✖</button>
          </div>
        </div>
      </div>

      <div id="alliance-info-box" style="display: none; flex-direction: column; gap: 6px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span id="alliance-display-name" style="font-size: 13px; font-weight: bold; color: var(--primary);">🛡️ 聯盟：無</span>
          <div style="display: flex; gap: 4px;">
            <button id="alliance-setting-btn" class="alliance-btn setting-btn" title="聯盟設定" onclick="openSettingsModal()" style="display: none; padding: 4px 8px;">⚙️</button>
            <button id="alliance-leave-btn" class="alliance-btn leave-btn" onclick="leaveAllianceFromUI()">退出</button>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px; background: rgba(0,0,0,0.25); padding: 6px; border-radius: 6px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span id="alliance-member-count" style="font-size: 11px; color: #9ca3af;">成員 (0人)</span>
            <button class="alliance-btn" style="padding: 2px 6px; font-size: 10px;" onclick="openMembersModal()">👥 查看全體成員</button>
          </div>
          <div id="alliance-top-members" style="font-size: 11px; color: var(--text);"></div>
        </div>

        <div id="alliance-requests-container" class="notice-box" style="display: none; border-color: var(--warning);">
          <div class="notice-row">
            <span id="req-count-title" style="color: var(--warning); font-weight: bold;">📥 申請清單 (0)</span>
          </div>
          <div class="req-item">
            <span id="req-oldest-name" style="color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px;">-</span>
            <div style="display: flex; gap: 4px;">
              <button class="icon-btn btn-approve" title="同意申請" onclick="respondAllianceApp(true)">✔</button>
              <button class="icon-btn btn-reject" title="拒絕申請" onclick="respondAllianceApp(false)">✖</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 🛠️ 二階沙盒開發者面板 -->
    <div id="sandbox-dev-card" style="display: none;">
      <div class="dev-panel-title">🛠️ 沙盒開發者面板</div>

      <div class="dev-tier1-tabs">
        <button class="dev-tab-btn active" onclick="switchDevTab('buff', this)">強化</button>
        <button class="dev-tab-btn" onclick="switchDevTab('monster', this)">生怪</button>
        <button class="dev-tab-btn" onclick="switchDevTab('enemy', this)">敵方</button>
        <button class="dev-tab-btn" onclick="switchDevTab('reset', this)">重置</button>
      </div>

      <div class="dev-tier2-container">
        <!-- 1. 強化頁面 -->
        <div id="dev-tab-buff" class="dev-sub-panel active">
          <button class="alliance-btn" style="padding: 4px 4px; font-size: 10px;" onclick="sandboxAddGold(10000)">💰 +10,000G</button>
          <button class="alliance-btn" style="padding: 4px 4px; font-size: 10px;" onclick="sandboxAddLevel(1)">⬆️ +1 等級</button>
          <button class="alliance-btn" style="padding: 4px 4px; font-size: 10px;" onclick="sandboxMaxLevel()">👑 等級封頂</button>
          <button class="alliance-btn dev-btn-green" style="padding: 4px 4px; font-size: 10px;" onclick="sandboxToggleGodMode()">🛡️ 無敵模式</button>
        </div>

        <!-- 2. 生怪頁面 -->
        <div id="dev-tab-monster" class="dev-sub-panel">
          <button class="alliance-btn" style="padding: 4px 4px; font-size: 10px;" onclick="sandboxSpawnMonster(false)">👾 紫晶怪</button>
          <button class="alliance-btn" style="padding: 4px 4px; font-size: 10px;" onclick="sandboxSpawnMonster(true)">👹 突襲菁英怪</button>
        </div>

        <!-- 3. 敵方單位頁面 -->
        <div id="dev-tab-enemy" class="dev-sub-panel">
          <button class="alliance-btn" style="padding: 4px 4px; font-size: 10px;" onclick="sandboxBuildEnemyTower('BASIC')">🗼 敵基礎塔</button>
          <button class="alliance-btn" style="padding: 4px 4px; font-size: 10px;" onclick="sandboxBuildEnemyTower('ADVANCED')">💥 敵重砲塔</button>
          <button class="alliance-btn" style="padding: 4px 4px; font-size: 10px;" onclick="sandboxSpawnEnemySoldier('BASIC')">🗡️ 敵方步兵</button>
          <button class="alliance-btn" style="padding: 4px 4px; font-size: 10px;" onclick="sandboxSpawnEnemySoldier('HEAVY')">🛡️ 敵重裝兵</button>
        </div>

        <!-- 4. 重置頁面 -->
        <div id="dev-tab-reset" class="dev-sub-panel">
          <button class="alliance-btn dev-btn-green" style="padding: 4px 4px; font-size: 10px;" onclick="sandboxHealAllUnits()">💚 恢復血量</button>
          <button class="alliance-btn dev-btn-green" style="padding: 4px 4px; font-size: 10px;" onclick="sandboxClearEnemies()">💚 清除敵方</button>
          <button class="alliance-btn leave-btn" style="padding: 4px 4px; font-size: 10px;" onclick="sandboxClearTowers()">💥 清除防禦塔</button>
          <button class="alliance-btn leave-btn" style="padding: 4px 4px; font-size: 10px;" onclick="sandboxClearAllSoldiers()">💥 重置部隊</button>
          <button class="alliance-btn leave-btn" style="padding: 4px 4px; font-size: 10px;" onclick="sandboxResetCore()">💥 重置基地</button>
          <button class="alliance-btn" style="padding: 4px 4px; font-size: 10px; background: rgba(255,255,255,0.1);" onclick="sandboxResetExp()">✨ 重置經驗</button>
          <button class="alliance-btn" style="padding: 4px 4px; font-size: 10px; background: rgba(255,255,255,0.1);" onclick="sandboxResetGold()">🪙 重置金幣(250)</button>
        </div>
      </div>
    </div>
  </div>

  <div id="settings-modal" class="modal-overlay"></div>
  <div id="members-modal" class="modal-overlay"></div>
  <div id="custom-confirm-modal" class="modal-overlay"></div>

  <div id="controls-bar">
    <button id="btn-back" class="key-btn back-btn" onclick="exitSubMenu()" style="display: none;">
      <span class="key-badge">~</span> <span>返回 / 退出</span>
    </button>
    <button id="btn-core" class="key-btn" onclick="triggerMenuKey('E')">
      <span class="key-badge">E</span> <span id="label-e">建基地</span>
    </button>
    <button id="btn-menu1" class="key-btn" onclick="triggerMenuKey('1')" style="display: none;">
      <span class="key-badge">1</span> <span id="label-1">防禦塔選單</span>
    </button>
    <button id="btn-menu2" class="key-btn" onclick="triggerMenuKey('2')" style="display: none;">
      <span class="key-badge">2</span> <span id="label-2">軍隊徵召選單</span>
    </button>
    <button id="btn-f" class="key-btn" onclick="triggerMenuKey('F')" style="display: none;">
      <span class="key-badge">F</span> <span>切換軍隊模式</span>
    </button>
  </div>

  <div id="game-over-modal">
    <h1>CORE DESTROYED</h1>
    <p style="color: #9ca3af;">你的基地已被摧毀，試著重新佈局戰術吧！</p>
    <div style="display: flex; gap: 16px; margin-top: 8px;">
      <button class="restart-btn" onclick="restartGame()">⚔️ 重新開始</button>
      <button class="restart-btn secondary-btn" onclick="returnToLobby()">🏠 回到大廳</button>
    </div>
  </div>
</div>

<script>
  function autoScaleGame() {
    const wrapper = document.getElementById('game-wrapper');
    if (!wrapper) return;
    const scale = Math.min((window.innerWidth * 0.95) / 1200, (window.innerHeight * 0.95) / 800);
    wrapper.style.transform = `scale(${scale})`;

    if (typeof window.updateCanvasRect === 'function') {
      window.updateCanvasRect();
    }
  }
  window.addEventListener('resize', autoScaleGame);
  window.addEventListener('DOMContentLoaded', autoScaleGame);
  autoScaleGame();

  function switchDevTab(tabId, btnEl) {
    document.querySelectorAll('.dev-tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.dev-sub-panel').forEach(p => p.classList.remove('active'));
    btnEl.classList.add('active');
    const panel = document.getElementById('dev-tab-' + tabId);
    if (panel) panel.classList.add('active');
  }
</script>
<script src="/socket.io/socket.io.js"></script>
<!-- 🧪 單機沙盒腳本 (依字母順序載入) -->
<script src="js/sandbox/sandboxClasses.js?v=22"></script>
<script src="js/sandbox/sandboxCombat.js?v=22"></script>
<script src="js/sandbox/sandboxDevTools.js?v=22"></script>
<script src="js/sandbox/sandboxEngine.js?v=22"></script>
<script src="js/ui.js?v=22"></script>
<script src="js/render.js?v=22"></script>
<script src="game.js?v=22"></script>
</body>
</html>
